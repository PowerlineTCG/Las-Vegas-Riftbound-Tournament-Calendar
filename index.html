<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LV Riftbound Tournament Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: rgba(255,255,255,0.07);
    --accent: #c8f135;
    --accent-dim: rgba(200,241,53,0.12);
    --accent-text: #0d0d0f;
    --text: #f0f0f0;
    --muted: #6b6b7a;
    --muted2: #3a3a46;
    --red: #ff5252;
    --blue: #5b9cf6;
    --amber: #f0a04b;
    --teal: #3ecfb2;
    --pink: #d966a0;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .header-left h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 2px;
    color: var(--accent);
    line-height: 1;
  }

  .header-left p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  .nav-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .nav-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .nav-btn:hover { background: var(--muted2); border-color: var(--muted); }

  .month-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1.5px;
    color: var(--text);
    min-width: 160px;
    text-align: center;
  }

  .today-btn {
    background: transparent;
    border: 1px solid var(--muted2);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .today-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* LEGEND */
  .legend {
    padding: 10px 32px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* CALENDAR GRID */
  .cal-wrap { padding: 0 32px 32px; }

  .dow-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--border);
    margin-bottom: 0;
  }

  .dow-cell {
    padding: 10px 8px 8px;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .day-cell {
    min-height: 110px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 8px 6px 6px;
    position: relative;
    vertical-align: top;
  }

  .day-cell:nth-child(7n) { border-right: none; }

  .day-cell.other-month .day-num { color: var(--muted2); }
  .day-cell.other-month { background: rgba(0,0,0,0.15); }

  .day-cell.is-today .day-num {
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 50%;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
  }

  .day-num {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
    margin-bottom: 5px;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .event-chip {
    font-size: 10.5px;
    font-weight: 500;
    padding: 3px 7px;
    border-radius: 5px;
    margin-bottom: 3px;
    cursor: pointer;
    transition: opacity 0.12s, transform 0.12s;
    letter-spacing: 0.1px;
    line-height: 1.4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    width: 100%;
    overflow: hidden;
  }

  .chip-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }

  .chip-time {
    font-size: 9.5px;
    font-weight: 400;
    opacity: 0.7;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .event-chip:hover { opacity: 0.8; transform: translateX(1px); }

  .more-badge {
    font-size: 10px;
    color: var(--muted);
    padding: 2px 6px;
    cursor: pointer;
    display: inline-block;
  }
  .more-badge:hover { color: var(--accent); }

  /* TYPE COLORS */
  .type-constructed { background: rgba(91,156,246,0.18); color: #8ab8f8; }
  .type-draft       { background: rgba(209,102,160,0.18); color: #e08ec0; }
  .type-2v2         { background: rgba(62,207,178,0.18); color: #5ddfc8; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 0;
    width: 100%;
    max-width: 420px;
    overflow: hidden;
    animation: pop 0.18s ease;
  }

  @keyframes pop {
    from { transform: scale(0.93); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }

  .modal-top {
    padding: 20px 22px 16px;
    border-bottom: 1px solid var(--border);
  }

  .modal-store {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 1.5px;
    color: var(--text);
    line-height: 1.1;
  }

  .modal-day-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    margin-top: 6px;
    letter-spacing: 0.3px;
  }

  .modal-body {
    padding: 18px 22px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .modal-field label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 4px;
  }

  .modal-field .val {
    font-size: 15px;
    font-weight: 400;
    color: var(--text);
  }

  .modal-field.full { grid-column: 1 / -1; }

  .prizing-val {
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
  }

  .modal-close {
    display: block;
    width: calc(100% - 44px);
    margin: 0 22px 18px;
    padding: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .modal-close:hover { border-color: var(--accent); color: var(--accent); }

  /* ENTRY FREE badge */
  .free-badge {
    font-size: 10px;
    background: rgba(200,241,53,0.15);
    color: var(--accent);
    padding: 2px 7px;
    border-radius: 20px;
    font-weight: 500;
    vertical-align: middle;
    margin-left: 4px;
  }

  @media (max-width: 640px) {
    header { padding: 18px 16px 14px; }
    .cal-wrap { padding: 0 8px 24px; }
    .legend { padding: 8px 16px; gap: 10px; }
    .event-chip { font-size: 9px; padding: 2px 5px; }
    .day-cell { min-height: 70px; padding: 5px 3px 3px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Riftbound LV</h1>
    <p>Local tournament schedule &mdash; Las Vegas</p>
  </div>
  <div class="nav-controls">
    <button class="today-btn" onclick="goToday()">Today</button>
    <button class="nav-btn" onclick="changeMonth(-1)">&#8592;</button>
    <div class="month-label" id="monthLabel"></div>
    <button class="nav-btn" onclick="changeMonth(1)">&#8594;</button>
  </div>
</header>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#8ab8f8"></div>Constructed</div>
  <div class="legend-item"><div class="legend-dot" style="background:#e08ec0"></div>Draft</div>
  <div class="legend-item"><div class="legend-dot" style="background:#5ddfc8"></div>2v2</div>
</div>

<div class="cal-wrap">
  <div class="dow-row" id="dowRow"></div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-top">
      <div class="modal-store" id="mStore"></div>
      <div class="modal-day-badge" id="mDayBadge"></div>
    </div>
    <div class="modal-body">
      <div class="modal-field">
        <label>Time</label>
        <div class="val" id="mTime"></div>
      </div>
      <div class="modal-field">
        <label>Format</label>
        <div class="val" id="mType"></div>
      </div>
      <div class="modal-field">
        <label>Entry fee</label>
        <div class="val" id="mEntry"></div>
      </div>
      <div class="modal-field">
        <label>Prizing</label>
        <div class="prizing-val" id="mPrizing"></div>
      </div>
    </div>
    <button class="modal-close" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
const DOW_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DOW_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const dayColors = {
  Sunday:    { badge: "rgba(240,160,75,0.2)",  text: "#f0c080" },
  Monday:    { badge: "rgba(91,156,246,0.2)",  text: "#8ab8f8" },
  Tuesday:   { badge: "rgba(209,102,160,0.2)", text: "#e08ec0" },
  Wednesday: { badge: "rgba(62,207,178,0.2)",  text: "#5ddfc8" },
  Thursday:  { badge: "rgba(200,241,53,0.15)", text: "#c8f135" },
  Friday:    { badge: "rgba(255,82,82,0.18)",  text: "#ff7070" },
  Saturday:  { badge: "rgba(180,130,255,0.18)",text: "#c09cff" },
};

const EVENTS = [
  {day:"Sunday",    store:"Vegas Singles",                 time:"3:00 PM", prizing:"PPW",             type:"Draft",       entry:"$30"},
  {day:"Sunday",    store:"Knight and Day",                time:"11:00 AM",prizing:"PPW",             type:"Constructed", entry:"$10"},
  {day:"Sunday",    store:"Phantasma",                     time:"3:00 PM", prizing:"BOX",             type:"Constructed", entry:"$10"},
  {day:"Sunday",    store:"Stomping Grounds",              time:"12:00 PM",prizing:"PPW",             type:"Constructed", entry:"$10"},
  {day:"Monday",    store:"Crossing",                      time:"6:30 PM", prizing:"Store Credit",    type:"Constructed", entry:"$10"},
  {day:"Monday",    store:"The People's Card Shop",        time:"6:30 PM", prizing:"PPW",             type:"Constructed", entry:"$10"},
  {day:"Monday",    store:"Knight and Day",                time:"6:30 PM", prizing:"PPW",             type:"Constructed", entry:"$10"},
  {day:"Tuesday",   store:"Shall We Play",                 time:"6:00 PM", prizing:"No Info",         type:"Constructed", entry:"No Info"},
  {day:"Tuesday",   store:"Vegas Singles",                 time:"6:00 PM", prizing:"PPW",             type:"Constructed", entry:"$10"},
  {day:"Tuesday",   store:"Tier 1",                        time:"6:00 PM", prizing:"No Info",         type:"Constructed", entry:"$5"},
  {day:"Tuesday",   store:"Phantasma",                     time:"6:30 PM", prizing:"Store Credit",    type:"Constructed", entry:"$10"},
  {day:"Wednesday", store:"Little Spectacles",             time:"6:30 PM", prizing:"Store Credit",    type:"Constructed", entry:"$10"},
  {day:"Wednesday", store:"Grandline Games",               time:"6:00 PM", prizing:"Top 8 Packs",     type:"Constructed", entry:"$10"},
  {day:"Wednesday", store:"The People's Card Shop",        time:"6:15 PM", prizing:"PPW",             type:"2 v 2",       entry:"$10"},
  {day:"Wednesday", store:"Gacha Claw",                    time:"6:00 PM", prizing:"No Info",         type:"Constructed", entry:"$0"},
  {day:"Thursday",  store:"Redemption",                    time:"1:00 PM", prizing:"Nexus PPW",       type:"Constructed", entry:"$0"},
  {day:"Thursday",  store:"Vegas Singles",                 time:"6:00 PM", prizing:"PPW",             type:"Constructed", entry:"$10"},
  {day:"Thursday",  store:"Power 9",                       time:"6:30 PM", prizing:"PPW",             type:"Constructed", entry:"$10"},
  {day:"Thursday",  store:"Stomping Grounds",              time:"6:00 PM", prizing:"PPW",             type:"Constructed", entry:"$10"},
  {day:"Friday",    store:"Many Realms Hub",               time:"6:30 PM", prizing:"PPW",             type:"Constructed", entry:"$10"},
  {day:"Friday",    store:"Omniscience",                   time:"7:00 PM", prizing:"No Info",         type:"Constructed", entry:"$0"},
  {day:"Saturday",  store:"Power 9",                       time:"2:00 PM", prizing:"PPW",             type:"Constructed", entry:"$10"},
  {day:"Saturday",  store:"The People's Card Shop",        time:"1:00 PM", prizing:"PPW",             type:"Constructed", entry:"$10"},
  {day:"Saturday",  store:"The People's Card Shop",        time:"4:30 PM", prizing:"PPW",             type:"Constructed", entry:"$10"},
  {day:"Saturday",  store:"Legacy (Skypoint)",             time:"12:00 PM",prizing:"No Info",         type:"Constructed", entry:"No Info"},
  {day:"Saturday",  store:"Many Realms Arena",             time:"3:00 PM", prizing:"No Info",         type:"Constructed", entry:"No Info"},
  {day:"Saturday",  store:"The Nostalgic Knick Knack",     time:"1:00 PM", prizing:"Store Credit",    type:"Constructed", entry:"$5"},
  {day:"Saturday",  store:"Darkside",                      time:"6:00 PM", prizing:"Store Credit",    type:"Constructed", entry:"$5"},
];

const typeClass = { "Constructed":"type-constructed", "Draft":"type-draft", "2 v 2":"type-2v2" };

let curYear, curMonth;
const today = new Date();

function init() {
  curYear = today.getFullYear();
  curMonth = today.getMonth();
  render();
}

function changeMonth(d) {
  curMonth += d;
  if (curMonth > 11) { curMonth = 0; curYear++; }
  if (curMonth < 0)  { curMonth = 11; curYear--; }
  render();
}

function goToday() {
  curYear = today.getFullYear();
  curMonth = today.getMonth();
  render();
}

function eventsForDow(dowIndex) {
  return EVENTS.filter(e => DOW_NAMES[dowIndex] === e.day);
}

function render() {
  document.getElementById("monthLabel").textContent = MONTHS[curMonth] + " " + curYear;

  // DOW headers
  const dowRow = document.getElementById("dowRow");
  dowRow.innerHTML = DOW_SHORT.map(d => `<div class="dow-cell">${d}</div>`).join("");

  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";

  const firstDay = new Date(curYear, curMonth, 1).getDay();
  const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
  const prevDays = new Date(curYear, curMonth, 0).getDate();

  // prev month padding
  for (let i = 0; i < firstDay; i++) {
    const d = prevDays - firstDay + 1 + i;
    grid.appendChild(makeCell(d, true, new Date(curYear, curMonth - 1, d)));
  }

  // current month
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(curYear, curMonth, d);
    const isToday = d === today.getDate() && curMonth === today.getMonth() && curYear === today.getFullYear();
    grid.appendChild(makeCell(d, false, date, isToday));
  }

  // trailing
  const total = firstDay + daysInMonth;
  const trail = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let i = 1; i <= trail; i++) {
    grid.appendChild(makeCell(i, true, new Date(curYear, curMonth + 1, i)));
  }
}

function makeCell(dayNum, otherMonth, date, isToday) {
  const cell = document.createElement("div");
  cell.className = "day-cell" + (otherMonth ? " other-month" : "") + (isToday ? " is-today" : "");

  const numDiv = document.createElement("div");
  numDiv.className = "day-num";
  numDiv.textContent = dayNum;
  cell.appendChild(numDiv);

  if (!otherMonth) {
    const dow = date.getDay();
    const evs = eventsForDow(dow);
    const MAX_SHOW = 3;

    evs.slice(0, MAX_SHOW).forEach(ev => {
      const chip = document.createElement("div");
      chip.className = "event-chip " + (typeClass[ev.type] || "type-constructed");
      chip.innerHTML = `<span class="chip-name">${ev.store}</span><span class="chip-time">${ev.time}</span>`;
      chip.title = ev.store + " — " + ev.time;
      chip.onclick = () => openModal(ev);
      cell.appendChild(chip);
    });

    if (evs.length > MAX_SHOW) {
      const more = document.createElement("div");
      more.className = "more-badge";
      more.textContent = "+" + (evs.length - MAX_SHOW) + " more";
      more.onclick = () => openAllModal(evs, date);
      cell.appendChild(more);
    }
  }

  return cell;
}

function openModal(ev) {
  document.getElementById("mStore").textContent = ev.store;
  const badge = document.getElementById("mDayBadge");
  badge.textContent = ev.day;
  const dc = dayColors[ev.day] || { badge: "rgba(255,255,255,0.1)", text: "#fff" };
  badge.style.background = dc.badge;
  badge.style.color = dc.text;

  document.getElementById("mTime").textContent = ev.time;
  document.getElementById("mType").textContent = ev.type;

  const entryEl = document.getElementById("mEntry");
  if (ev.entry === "$0") {
    entryEl.innerHTML = 'Free <span class="free-badge">FREE</span>';
  } else {
    entryEl.textContent = ev.entry;
  }

  document.getElementById("mPrizing").textContent = ev.prizing;
  document.getElementById("modalOverlay").classList.add("open");
}

function openAllModal(evs, date) {
  openModal(evs[3]);
}

function closeModal(e) {
  if (!e || e.target === document.getElementById("modalOverlay")) {
    document.getElementById("modalOverlay").classList.remove("open");
  }
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

init();
</script>
</body>
</html>
