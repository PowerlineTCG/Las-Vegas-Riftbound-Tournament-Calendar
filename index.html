<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Las Vegas Nexus Nights Schedule</title>

<!-- Discord / Open Graph preview -->
<meta property="og:title" content="Las Vegas Nexus Nights Schedule" />
<meta property="og:description" content="Weekly local tournament schedule for Las Vegas — stores, times, formats, and prizing." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://powerlinetcg.github.io/Las-Vegas-Riftbound-Tournament-Calendar/" />
<meta name="theme-color" content="#c9a84c" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:        #0e1628;
    --navy2:       #152035;
    --navy3:       #1c2d47;
    --navy4:       #243655;
    --gold:        #c9a84c;
    --gold-light:  #e8cc80;
    --gold-dim:    rgba(201,168,76,0.15);
    --gold-border: rgba(201,168,76,0.3);
    --white:       #f0eadc;
    --muted:       #7a8fa8;
    --muted2:      #3a4f68;
    --border:      rgba(201,168,76,0.12);
    --border2:     rgba(255,255,255,0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'Lato', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    padding: 24px 32px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    background: linear-gradient(180deg, #080e1c 0%, var(--navy) 100%);
    position: relative;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .header-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex: 1;
    text-align: center;
  }

  .header-logo {
    height: 80px;
    width: auto;
    object-fit: contain;
  }

  .header-left h1 {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1.1;
  }

  .nav-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .nav-btn {
    background: var(--navy3);
    border: 1px solid var(--gold-border);
    color: var(--gold);
    width: 36px; height: 36px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-family: 'Lato', sans-serif;
  }
  .nav-btn:hover { background: var(--navy4); border-color: var(--gold); }

  .month-label {
    font-family: 'Cinzel', serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--white);
    min-width: 180px;
    text-align: center;
    text-transform: uppercase;
  }

  .today-btn {
    background: transparent;
    border: 1px solid var(--gold-border);
    color: var(--gold);
    font-family: 'Lato', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .today-btn:hover { background: var(--gold-dim); border-color: var(--gold); }

  /* LEGEND */
  .legend {
    padding: 9px 32px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border2);
    background: var(--navy2);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; }

  /* CALENDAR */
  .cal-wrap { padding: 0 32px 32px; }

  .dow-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .dow-cell {
    padding: 12px 8px 9px;
    font-family: 'Cinzel', serif;
    font-size: 9.5px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .day-cell {
    min-height: 115px;
    border-right: 1px solid var(--border2);
    border-bottom: 1px solid var(--border2);
    padding: 8px 6px 6px;
    vertical-align: top;
  }
  .day-cell:nth-child(7n) { border-right: none; }
  .day-cell.other-month { background: rgba(5,9,18,0.45); }
  .day-cell.other-month .day-num { color: var(--muted2); }
  .day-cell.is-today { background: rgba(201,168,76,0.04); }
  .day-cell.is-today .day-num {
    background: var(--gold);
    color: var(--navy);
    border-radius: 50%;
    width: 24px; height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }

  .day-num {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
    margin-bottom: 5px;
    width: 24px; height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* CHIPS */
  .event-chip {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 6px;
    border-radius: 4px;
    margin-bottom: 3px;
    cursor: pointer;
    transition: opacity 0.12s, transform 0.1s;
    line-height: 1.4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 3px;
    width: 100%;
    overflow: hidden;
  }
  .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .chip-time { font-size: 9px; font-weight: 400; opacity: 0.7; white-space: nowrap; flex-shrink: 0; }
  .event-chip:hover { opacity: 0.75; transform: translateX(1px); }

  .type-constructed { background: rgba(201,168,76,0.16); color: #e8cc80; border-left: 2px solid rgba(201,168,76,0.45); }
  .type-draft       { background: rgba(100,160,230,0.16); color: #90c0f0; border-left: 2px solid rgba(100,160,230,0.45); }
  .type-2v2         { background: rgba(80,200,160,0.16);  color: #70d8b8; border-left: 2px solid rgba(80,200,160,0.45); }

  .more-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: var(--gold);
    opacity: 0.65;
    padding: 2px 4px;
    cursor: pointer;
    display: inline-block;
    transition: opacity 0.12s;
  }
  .more-badge:hover { opacity: 1; }

  /* ALL EVENTS LIST */
  .all-ev-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 11px 0;
    border-bottom: 1px solid var(--border2);
    gap: 8px;
  }
  .all-ev-row:last-child { border-bottom: none; }
  .all-ev-name    { font-size: 14px; font-weight: 700; color: var(--white); margin-bottom: 3px; }
  .all-ev-details { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .all-ev-prizing { font-size: 12px; color: var(--gold); font-weight: 700; text-align: right; white-space: nowrap; margin-top: 2px; }

  /* MODALS */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(4,7,16,0.82);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--navy2);
    border: 1px solid var(--gold-border);
    border-radius: 12px;
    width: 100%;
    max-width: 420px;
    overflow: hidden;
    animation: pop 0.16s ease;
  }
  @keyframes pop {
    from { transform: scale(0.94); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }

  .modal-top {
    padding: 20px 22px 16px;
    background: linear-gradient(135deg, var(--navy3), var(--navy2));
    position: relative;
  }
  .modal-top::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-border), transparent);
  }

  .modal-store {
    font-family: 'Cinzel', serif;
    font-size: 21px;
    font-weight: 700;
    color: var(--white);
    line-height: 1.2;
    letter-spacing: 0.5px;
  }

  .modal-day-badge {
    display: inline-block;
    font-family: 'Lato', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    margin-top: 8px;
    border: 1px solid var(--gold-border);
    color: var(--gold);
    background: var(--gold-dim);
  }

  .modal-body {
    padding: 18px 22px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .modal-field label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 5px;
  }

  .modal-field .val { font-size: 15px; font-weight: 400; color: var(--white); }

  .prizing-val {
    font-size: 15px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.3px;
  }

  .modal-close {
    display: block;
    width: calc(100% - 44px);
    margin: 0 22px 18px;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--gold-border);
    color: var(--gold);
    font-family: 'Lato', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .modal-close:hover { background: var(--gold-dim); }

  .free-badge {
    font-size: 9px;
    background: var(--gold-dim);
    color: var(--gold);
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    vertical-align: middle;
    margin-left: 4px;
    border: 1px solid var(--gold-border);
  }

  /* MOBILE AGENDA VIEW */
  .agenda-wrap { display: none; padding: 12px 16px 32px; }

  .agenda-day {
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .agenda-day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    background: var(--navy2);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .agenda-day-header:active { background: var(--navy3); }
  .agenda-day-header.today-header {
    background: linear-gradient(135deg, var(--navy3), rgba(201,168,76,0.1));
  }

  .agenda-day-name {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .agenda-day-header.today-header .agenda-day-name {
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .agenda-day-meta { display: flex; align-items: center; gap: 10px; }

  .agenda-count {
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    background: var(--navy3);
    padding: 2px 8px;
    border-radius: 20px;
  }

  .agenda-chevron {
    font-size: 11px;
    color: var(--gold);
    opacity: 0.6;
    transition: transform 0.2s;
    display: inline-block;
  }
  .agenda-day.open .agenda-chevron { transform: rotate(180deg); }

  .agenda-events { display: none; background: var(--navy); }
  .agenda-day.open .agenda-events { display: block; }

  .agenda-event-row {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-top: 1px solid var(--border2);
    cursor: pointer;
    transition: background 0.12s;
    gap: 10px;
  }
  .agenda-event-row:active { background: var(--navy2); }

  .agenda-event-left { flex: 1; min-width: 0; }

  .agenda-event-store {
    font-size: 14px;
    font-weight: 700;
    color: var(--white);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .agenda-event-sub {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .agenda-type-pill {
    font-size: 9px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 20px;
  }
  .agenda-type-pill.type-constructed { background: rgba(201,168,76,0.16); color: #e8cc80; }
  .agenda-type-pill.type-draft       { background: rgba(100,160,230,0.16); color: #90c0f0; }
  .agenda-type-pill.type-2v2         { background: rgba(80,200,160,0.16);  color: #70d8b8; }

  .agenda-event-right { text-align: right; flex-shrink: 0; }

  .agenda-event-time {
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    display: block;
    margin-bottom: 2px;
  }

  .agenda-event-prizing { font-size: 11px; color: var(--muted); }

  .agenda-arrow { font-size: 12px; color: var(--muted2); margin-left: 4px; flex-shrink: 0; }

  @media (max-width: 768px) {
    header { padding: 16px 16px 14px; flex-direction: column; align-items: center; gap: 10px; }
    header > div:first-child { display: none; }
    .header-center { gap: 6px; width: 100%; }
    .header-logo { height: 56px; }
    .header-left h1 { font-size: 12px; letter-spacing: 2.5px; text-align: center; }
    .nav-controls { width: 100%; justify-content: center; gap: 8px; }
    .month-label { font-size: 14px; min-width: 130px; }
    .legend { padding: 8px 16px; }
    .cal-wrap { display: none; }
    .agenda-wrap { display: block; }
  }
</style>
</head>
<body>

<header>
  <div style="width:120px; display:flex; align-items:center;">
    <!-- spacer to balance nav on right -->
  </div>
  <div class="header-center">
    <img src="riftbound-logo.png" alt="Riftbound League of Legends Trading Card Game" class="header-logo" />
    <div class="header-left">
      <h1>Las Vegas Nexus Nights Schedule</h1>
    </div>
  </div>
  <div class="nav-controls">
    <button class="today-btn" onclick="goToday()">Today</button>
    <button class="nav-btn" onclick="changeMonth(-1)">&#8592;</button>
    <div class="month-label" id="monthLabel"></div>
    <button class="nav-btn" onclick="changeMonth(1)">&#8594;</button>
  </div>
</header>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#e8cc80"></div>Constructed</div>
  <div class="legend-item"><div class="legend-dot" style="background:#90c0f0"></div>Draft</div>
  <div class="legend-item"><div class="legend-dot" style="background:#70d8b8"></div>2v2</div>
</div>

<div class="cal-wrap">
  <div class="dow-row" id="dowRow"></div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- MOBILE AGENDA VIEW -->
<div class="agenda-wrap" id="agendaWrap"></div>

<!-- SINGLE EVENT MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-top">
      <div class="modal-store" id="mStore"></div>
      <div class="modal-day-badge" id="mDayBadge"></div>
    </div>
    <div class="modal-body">
      <div class="modal-field"><label>Time</label><div class="val" id="mTime"></div></div>
      <div class="modal-field"><label>Format</label><div class="val" id="mType"></div></div>
      <div class="modal-field"><label>Entry fee</label><div class="val" id="mEntry"></div></div>
      <div class="modal-field"><label>Prizing</label><div class="prizing-val" id="mPrizing"></div></div>
    </div>
    <button class="modal-close" onclick="closeModal()">Close</button>
  </div>
</div>

<!-- ALL EVENTS MODAL -->
<div class="modal-overlay" id="allModalOverlay" onclick="closeAllModal(event)">
  <div class="modal">
    <div class="modal-top">
      <div class="modal-store" id="allModalTitle"></div>
      <div class="modal-day-badge" id="allModalBadge"></div>
    </div>
    <div id="allModalList" style="padding:8px 22px 4px;"></div>
    <button class="modal-close" onclick="closeAllModal()">Close</button>
  </div>
</div>

<script>
const DOW_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS    = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const EVENTS = [
  {day:"Sunday",    store:"Vegas Singles",             time:"3:00 PM",  prizing:"PPW",          type:"Draft",       entry:"$30"},
  {day:"Sunday",    store:"Knight and Day",            time:"11:00 AM", prizing:"PPW",          type:"Constructed", entry:"$10"},
  {day:"Sunday",    store:"Phantasma",                 time:"3:00 PM",  prizing:"BOX",          type:"Constructed", entry:"$10"},
  {day:"Sunday",    store:"Stomping Grounds",          time:"12:00 PM", prizing:"PPW",          type:"Constructed", entry:"$10"},
  {day:"Monday",    store:"Crossing",                  time:"6:30 PM",  prizing:"Store Credit", type:"Constructed", entry:"$10"},
  {day:"Monday",    store:"The People's Card Shop",    time:"6:30 PM",  prizing:"PPW",          type:"Constructed", entry:"$10"},
  {day:"Monday",    store:"Knight and Day",            time:"6:30 PM",  prizing:"PPW",          type:"Constructed", entry:"$10"},
  {day:"Tuesday",   store:"Shall We Play",             time:"6:00 PM",  prizing:"No Info",      type:"Constructed", entry:"No Info"},
  {day:"Tuesday",   store:"Vegas Singles",             time:"6:00 PM",  prizing:"PPW",          type:"Constructed", entry:"$10"},
  {day:"Tuesday",   store:"Tier 1",                    time:"6:00 PM",  prizing:"No Info",      type:"Constructed", entry:"$5"},
  {day:"Tuesday",   store:"Phantasma",                 time:"6:30 PM",  prizing:"Store Credit", type:"Constructed", entry:"$10"},
  {day:"Wednesday", store:"Little Spectacles",         time:"6:30 PM",  prizing:"Store Credit", type:"Constructed", entry:"$10"},
  {day:"Wednesday", store:"Grandline Games",           time:"6:00 PM",  prizing:"Top 8 Packs",  type:"Constructed", entry:"$10"},
  {day:"Wednesday", store:"The People's Card Shop",    time:"6:15 PM",  prizing:"PPW",          type:"2 v 2",       entry:"$10"},
  {day:"Wednesday", store:"Gacha Claw",                time:"6:00 PM",  prizing:"No Info",      type:"Constructed", entry:"$0"},
  {day:"Thursday",  store:"Redemption",                time:"1:00 PM",  prizing:"Nexus PPW",    type:"Constructed", entry:"$0"},
  {day:"Thursday",  store:"Vegas Singles",             time:"6:00 PM",  prizing:"PPW",          type:"Constructed", entry:"$10"},
  {day:"Thursday",  store:"Power 9",                   time:"6:30 PM",  prizing:"PPW",          type:"Constructed", entry:"$10"},
  {day:"Thursday",  store:"Stomping Grounds",          time:"6:00 PM",  prizing:"PPW",          type:"Constructed", entry:"$10"},
  {day:"Friday",    store:"Many Realms Hub",           time:"6:30 PM",  prizing:"PPW",          type:"Constructed", entry:"$10"},
  {day:"Friday",    store:"Omniscience",               time:"7:00 PM",  prizing:"No Info",      type:"Constructed", entry:"$0"},
  {day:"Saturday",  store:"Power 9",                   time:"2:00 PM",  prizing:"PPW",          type:"Constructed", entry:"$10"},
  {day:"Saturday",  store:"The People's Card Shop",    time:"1:00 PM",  prizing:"PPW",          type:"Constructed", entry:"$10"},
  {day:"Saturday",  store:"The People's Card Shop",    time:"4:30 PM",  prizing:"PPW",          type:"Constructed", entry:"$10"},
  {day:"Saturday",  store:"Legacy (Skypoint)",         time:"12:00 PM", prizing:"No Info",      type:"Constructed", entry:"No Info"},
  {day:"Saturday",  store:"Many Realms Arena",         time:"3:00 PM",  prizing:"No Info",      type:"Constructed", entry:"No Info"},
  {day:"Saturday",  store:"The Nostalgic Knick Knack", time:"1:00 PM",  prizing:"Store Credit", type:"Constructed", entry:"$5"},
  {day:"Saturday",  store:"Darkside",                  time:"6:00 PM",  prizing:"Store Credit", type:"Constructed", entry:"$5"},
];

const typeClass = { "Constructed":"type-constructed", "Draft":"type-draft", "2 v 2":"type-2v2" };
let curYear, curMonth;
const today = new Date();
const todayDow = today.getDay();

function init() { curYear = today.getFullYear(); curMonth = today.getMonth(); render(); renderAgenda(); }

function renderAgenda() {
  const wrap = document.getElementById("agendaWrap");
  wrap.innerHTML = "";

  DOW_NAMES.forEach((dayName, dowIndex) => {
    const evs = EVENTS.filter(e => e.day === dayName);
    const isToday = dowIndex === todayDow;

    const section = document.createElement("div");
    section.className = "agenda-day" + (isToday ? " open" : "");

    const header = document.createElement("div");
    header.className = "agenda-day-header" + (isToday ? " today-header" : "");
    header.innerHTML = `
      <span class="agenda-day-name">${isToday ? "&#9733; " : ""}${dayName}</span>
      <div class="agenda-day-meta">
        <span class="agenda-count">${evs.length} store${evs.length !== 1 ? "s" : ""}</span>
        <span class="agenda-chevron">&#9660;</span>
      </div>
    `;
    header.onclick = () => section.classList.toggle("open");

    const eventList = document.createElement("div");
    eventList.className = "agenda-events";

    evs.forEach(ev => {
      const row = document.createElement("div");
      row.className = "agenda-event-row";
      const pillClass = typeClass[ev.type] || "type-constructed";
      row.innerHTML = `
        <div class="agenda-event-left">
          <div class="agenda-event-store">${ev.store}</div>
          <div class="agenda-event-sub">
            <span class="agenda-type-pill ${pillClass}">${ev.type}</span>
            <span>Entry: ${ev.entry}</span>
          </div>
        </div>
        <div class="agenda-event-right">
          <span class="agenda-event-time">${ev.time}</span>
          <div class="agenda-event-prizing">${ev.prizing}</div>
        </div>
        <span class="agenda-arrow">&#8250;</span>
      `;
      row.onclick = () => openModal(ev);
      eventList.appendChild(row);
    });

    section.appendChild(header);
    section.appendChild(eventList);
    wrap.appendChild(section);
  });
}

function changeMonth(d) {
  curMonth += d;
  if (curMonth > 11) { curMonth = 0; curYear++; }
  if (curMonth < 0)  { curMonth = 11; curYear--; }
  render();
}

function goToday() { curYear = today.getFullYear(); curMonth = today.getMonth(); render(); }

function eventsForDow(i) { return EVENTS.filter(e => DOW_NAMES[i] === e.day); }

function render() {
  document.getElementById("monthLabel").textContent = MONTHS[curMonth] + " " + curYear;
  document.getElementById("dowRow").innerHTML = DOW_NAMES.map(d => `<div class="dow-cell">${d}</div>`).join("");

  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";

  const firstDay    = new Date(curYear, curMonth, 1).getDay();
  const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
  const prevDays    = new Date(curYear, curMonth, 0).getDate();

  for (let i = 0; i < firstDay; i++)
    grid.appendChild(makeCell(prevDays - firstDay + 1 + i, true, new Date(curYear, curMonth - 1, prevDays - firstDay + 1 + i)));

  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = d === today.getDate() && curMonth === today.getMonth() && curYear === today.getFullYear();
    grid.appendChild(makeCell(d, false, new Date(curYear, curMonth, d), isToday));
  }

  const trail = (firstDay + daysInMonth) % 7;
  if (trail) for (let i = 1; i <= 7 - trail; i++)
    grid.appendChild(makeCell(i, true, new Date(curYear, curMonth + 1, i)));
}

function makeCell(dayNum, otherMonth, date, isToday) {
  const cell = document.createElement("div");
  cell.className = "day-cell" + (otherMonth ? " other-month" : "") + (isToday ? " is-today" : "");

  const numDiv = document.createElement("div");
  numDiv.className = "day-num";
  numDiv.textContent = dayNum;
  cell.appendChild(numDiv);

  if (!otherMonth) {
    const evs = eventsForDow(date.getDay());
    const MAX = 4;
    evs.slice(0, MAX).forEach(ev => {
      const chip = document.createElement("div");
      chip.className = "event-chip " + (typeClass[ev.type] || "type-constructed");
      chip.innerHTML = `<span class="chip-name">${ev.store}</span><span class="chip-time">${ev.time}</span>`;
      chip.onclick = () => openModal(ev);
      cell.appendChild(chip);
    });
    if (evs.length > MAX) {
      const more = document.createElement("div");
      more.className = "more-badge";
      more.textContent = "+" + (evs.length - MAX) + " more";
      more.onclick = () => openAllModal(evs);
      cell.appendChild(more);
    }
  }
  return cell;
}

function openModal(ev) {
  document.getElementById("mStore").textContent = ev.store;
  document.getElementById("mDayBadge").textContent = ev.day;
  document.getElementById("mTime").textContent = ev.time;
  document.getElementById("mType").textContent = ev.type;
  const entryEl = document.getElementById("mEntry");
  entryEl.innerHTML = ev.entry === "$0" ? 'Free <span class="free-badge">FREE</span>' : ev.entry;
  document.getElementById("mPrizing").textContent = ev.prizing;
  document.getElementById("modalOverlay").classList.add("open");
}

function openAllModal(evs) {
  const day = evs[0].day;
  document.getElementById("allModalTitle").textContent = day + " Tournaments";
  document.getElementById("allModalBadge").textContent = day;
  document.getElementById("allModalList").innerHTML = evs.map(ev => `
    <div class="all-ev-row">
      <div style="flex:1;min-width:0;">
        <div class="all-ev-name">${ev.store}</div>
        <div class="all-ev-details">${ev.time} &nbsp;·&nbsp; ${ev.type} &nbsp;·&nbsp; Entry: ${ev.entry}</div>
      </div>
      <div class="all-ev-prizing">${ev.prizing}</div>
    </div>
  `).join("");
  document.getElementById("allModalOverlay").classList.add("open");
}

function closeModal(e) {
  if (!e || e.target === document.getElementById("modalOverlay"))
    document.getElementById("modalOverlay").classList.remove("open");
}

function closeAllModal(e) {
  if (!e || e.target === document.getElementById("allModalOverlay"))
    document.getElementById("allModalOverlay").classList.remove("open");
}

document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); closeAllModal(); } });
init();
</script>
</body>
</html>
